<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>実質キャッシュ管理 (RealCash)</title>
  <!-- PWA・ホーム画面アプリ化設定（全画面起動・テーマカラー・専用アイコン） -->
  <meta name="application-name" content="RealCash" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="RealCash" />
  <link id="pwa-icon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230f172a'/%3E%3Cg fill='none' stroke='%2334d399' stroke-width='28' stroke-linecap='round' stroke-linejoin='round' transform='translate(96,96) scale(13.333)'%3E%3Cpath d='M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1'/%3E%3Cpath d='M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4'/%3E%3C/g%3E%3C/svg%3E" />
  <link id="pwa-apple-icon" rel="apple-touch-icon" href="" />
  <link id="pwa-manifest" rel="manifest" href="" />
  <style>
    /* =========================================================
       デザインシステム（外部CDNゼロ・軽量モダンライトテーマ）
       ========================================================= */
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --border-soft: #f1f5f9;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --slate: #0f172a;
      --indigo: #4f46e5;
      --indigo-bg: #eef2ff;
      --emerald: #059669;
      --emerald-bg: #ecfdf5;
      --purple: #7c3aed;
      --purple-bg: #f5f3ff;
      --amber: #d97706;
      --amber-bg: #fffbeb;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      width: 100%;
    }
    /* ネイティブアプリ風の軽快なタップ応答と誤選択防止 */
    button, input, select, textarea, label { touch-action: manipulation; }
    .sidebar, .mobile-header, .mobile-nav, .btn, .seg-btn, .mnav-btn, .nav-item, .acc-trigger {
      user-select: none;
      -webkit-user-select: none;
    }

    .nums { font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .nowrap { white-space: nowrap; flex-shrink: 0; }

    /* アプリ全体シェル */
    .app-shell { display: flex; min-height: 100vh; width: 100%; }
    .content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* PC固定サイドバー */
    .sidebar {
      width: 252px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      inset: 0 auto 0 0;
      display: flex;
      flex-direction: column;
      z-index: 30;
    }
    .brand {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px; height: 36px;
      border-radius: 11px;
      background: var(--slate);
      color: #34d399;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
    .brand p { font-size: 11px; color: var(--text-muted); }

    .sidebar-actions { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .nav-list { padding: 4px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px;
      border: none; background: transparent;
      border-radius: 11px; font-size: 13.5px; font-weight: 600;
      color: var(--text-sub); cursor: pointer; text-align: left;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--indigo-bg); color: var(--indigo); font-weight: 700; }

    .sidebar-summary {
      margin: 12px; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px;
    }
    .sidebar-summary .lbl { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .sidebar-summary .val { font-size: 18px; font-weight: 800; margin-top: 2px; }
    .sidebar-summary .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* スマホ上部スティッキーヘッダー */
    .mobile-header {
      display: none;
      position: sticky; top: 0; z-index: 30;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: max(10px, env(safe-area-inset-top)) 14px 10px;
      align-items: center; justify-content: space-between; gap: 8px;
    }

    /* スマホ下部タブバー */
    .mobile-nav {
      display: none;
      position: fixed; inset: auto 0 0 0; z-index: 35;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 6px 4px max(8px, env(safe-area-inset-bottom));
      grid-template-columns: repeat(5, 1fr);
    }
    .mnav-btn {
      border: none; background: transparent; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      padding: 6px 2px; border-radius: 10px;
      font-size: 10.5px; font-weight: 600; color: var(--text-muted);
      font-family: inherit;
      transition: transform 0.1s ease, background 0.15s, color 0.15s;
    }
    .mnav-btn:active { transform: scale(0.94); }
    .mnav-btn.active { color: var(--indigo); background: var(--indigo-bg); font-weight: 700; }

    /* メインコンテンツ領域 */
    .main {
      flex: 1;
      margin-left: 252px;
      padding: 24px 24px 56px;
      min-width: 0;
    }
    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    @media (max-width: 820px) {
      .sidebar { display: none; }
      .mobile-header { display: flex; }
      .mobile-nav { display: grid; }
      /* 下部タブバーに絶対隠れないよう十分な下部余白を確保 */
      .main { margin-left: 0; padding: 14px 12px 108px; }
    }

    /* 共通カード・見出し */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      min-width: 0;
    }
    .card-tight { padding: 14px 16px; }
    @media (max-width: 480px) {
      .card { padding: 15px 14px; }
      .card-tight { padding: 12px 13px; }
    }

    .page-head {
      display: flex; flex-wrap: wrap; align-items: flex-end;
      justify-content: space-between; gap: 10px;
    }
    .page-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
    .page-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

    /* ボタン群（重なり防止のため white-space: nowrap; flex-shrink: 0 を徹底） */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 9px 14px; border-radius: var(--radius-sm);
      border: 1px solid transparent; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s, background 0.15s, transform 0.08s;
      white-space: nowrap; flex-shrink: 0; font-family: inherit;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 7px 11px; font-size: 12.5px; border-radius: 9px; }
    .btn-xs { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-primary { background: var(--slate); color: #fff; }
    .btn-primary:hover { background: #1e293b; }
    .btn-indigo { background: var(--indigo); color: #fff; }
    .btn-indigo:hover { background: #4338ca; }
    .btn-emerald { background: var(--emerald); color: #fff; }
    .btn-emerald:hover { background: #047857; }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-purple:hover { background: #6d28d9; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-red:hover { background: #b91c1c; }
    .btn-soft { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-soft:hover { background: #e2e8f0; }
    .btn-soft-emerald { background: var(--emerald-bg); color: var(--emerald); border-color: #a7f3d0; }
    .btn-soft-indigo { background: var(--indigo-bg); color: var(--indigo); border-color: #c7d2fe; }
    .btn-soft-purple { background: var(--purple-bg); color: var(--purple); border-color: #ddd6fe; }
    .btn-soft-red { background: var(--red-bg); color: var(--red); border-color: #fecaca; }
    .btn-soft-amber { background: var(--amber-bg); color: #b45309; border-color: #fde68a; }
    .btn-icon {
      min-width: 30px; height: 30px; padding: 0 7px; border-radius: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text-sub); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 12px; font-weight: 700;
    }
    .btn-icon:hover { background: #e2e8f0; color: var(--text); }

    /* バッジ（nowrap & shrink 0） */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
      white-space: nowrap; flex-shrink: 0;
    }
    .b-emerald { background: var(--emerald-bg); color: var(--emerald); }
    .b-indigo { background: var(--indigo-bg); color: var(--indigo); }
    .b-purple { background: var(--purple-bg); color: var(--purple); }
    .b-red { background: var(--red-bg); color: var(--red); }
    .b-amber { background: var(--amber-bg); color: #b45309; }
    .b-slate { background: var(--surface-2); color: var(--text-sub); }

    /* セグメント切替 */
    .seg {
      display: inline-flex; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 3px; gap: 2px; flex-wrap: wrap; max-width: 100%;
    }
    .seg-btn {
      border: none; background: transparent; color: var(--text-sub);
      padding: 6px 11px; border-radius: 7px; font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .seg-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
    .seg-btn.active-purple { background: var(--purple); color: #fff; }
    .seg-btn.active-emerald { background: var(--emerald); color: #fff; }
    .seg-btn.active-slate { background: var(--slate); color: #fff; }

    /* トグルスイッチ */
    .switch {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
      border-radius: 999px; border: none; cursor: pointer;
      background: #cbd5e1; transition: background 0.18s; padding: 0;
    }
    .switch.on { background: var(--emerald); }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform 0.18s;
    }
    .switch.on::after { transform: translateX(18px); }

    /* グリッド */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }

    /* テキスト色 */
    .text-emerald { color: var(--emerald); }
    .text-red { color: var(--red); }
    .text-purple { color: var(--purple); }
    .text-indigo { color: var(--indigo); }
    .text-amber { color: var(--amber); }
    .text-muted { color: var(--text-muted); }

    /* ヒーローカード・計算式・バー */
    .hero-amount {
      font-size: clamp(30px, 6vw, 44px);
      font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; margin-top: 6px;
    }
    .formula-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px; margin-top: 14px; padding: 10px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    }
    .formula-box { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; min-width: 0; }
    .formula-box .k { font-size: 10.5px; color: var(--text-muted); font-weight: 600; }
    .formula-box .v { font-size: 14px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
    .formula-box.dark { background: var(--slate); border-color: var(--slate); color: #fff; }
    .formula-box.dark .k { color: #cbd5e1; }

    .stack-bar { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; display: flex; margin-top: 6px; }
    .stack-seg { height: 100%; transition: width 0.35s ease; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-top: 8px; font-size: 11.5px; color: var(--text-sub); }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }

    /* 進捗・比較バー */
    .prog-track { height: 9px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .prog-fill { height: 100%; border-radius: 999px; transition: width 0.3s; }

    /* =========================================================
       スマホ完全最適化：3段構造アイテムカード＆上下段リスト行
       （タイトル縦潰れ・文字重なりを構造的にゼロ化）
       ========================================================= */
    .stack-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 予定収入・予定収支アイテム：厳守の3段構造 */
    .sched-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .sched-card.inactive { opacity: 0.58; background: #f8fafc; }

    /* 1段目：左にトグルスイッチ＋タイトル、右に金額 */
    .sched-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .sched-top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .sched-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap: break-word;
      writing-mode: horizontal-tb;
    }
    .sched-amount {
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 15.5px;
      font-weight: 800;
    }

    /* 2段目：周期・日付バッジ＋口座・引当情報 */
    .sched-row-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* 3段目：アクションボタン群（独立段・右寄せ・重なりゼロ） */
    .sched-row-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
      margin-top: 2px;
      padding-top: 9px;
      border-top: 1px solid var(--border-soft);
    }

    /* 取引履歴・直近取引：上下2段構造 */
    .list-box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
    .list-head {
      padding: 11px 14px; background: var(--bg); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-sub);
    }
    .tx-row {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background 0.12s;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-row:hover { background: #f8fafc; }
    .tx-row.selected { background: #eef2ff; }
    .tx-row-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
    }
    .tx-row-left {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }
    .tx-row-title {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      word-break: break-word;
    }
    .tx-row-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tx-row-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      min-width: 0;
      flex: 1;
    }

    /* 一括操作バー */
    .bulk-bar {
      position: sticky; top: 58px; z-index: 25;
      background: var(--slate); color: #fff; border-radius: 12px;
      padding: 11px 14px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 10px; box-shadow: var(--shadow-lg);
    }
    @media (min-width: 821px) { .bulk-bar { top: 12px; } }

    /* 将来予測アコーディオン（スマホ最適化の上下段） */
    .acc-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .acc-item.warn { border-color: #fca5a5; }
    .acc-trigger {
      width: 100%; border: none; background: transparent; padding: 13px 14px;
      cursor: pointer; text-align: left; font-family: inherit;
      display: flex; flex-direction: column; gap: 8px;
    }
    .acc-trigger:hover { background: #f8fafc; }
    .acc-head-row {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
    }
    .acc-metrics-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: 100%;
      font-size: 11.5px;
    }
    @media (min-width: 640px) { .acc-metrics-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .acc-mini-pill {
      background: var(--bg); border: 1px solid var(--border-soft);
      border-radius: 8px; padding: 5px 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 4px;
    }
    .acc-panel {
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 12px; display: flex; flex-direction: column; gap: 9px;
    }
    /* 月別予測の個別明細行（3段構造） */
    .acc-line {
      background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
      padding: 11px 12px; display: flex; flex-direction: column; gap: 6px;
    }

    /* フォーム要素 */
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field label { font-size: 12px; font-weight: 700; color: var(--text-sub); }
    .input, .select, .textarea {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong);
      border-radius: 9px; background: var(--surface); color: var(--text);
      font-size: 14px; font-family: inherit; outline: none; transition: border-color 0.15s;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12); }
    .input-yen-wrap { position: relative; width: 100%; }
    .input-yen-wrap span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-weight: 700; pointer-events: none; }

      expense_provision_credit: { label: '引当支出(クレカ)', color: 'b-amber', sign: '-', cls: 'text-amber', isActual: false, isActualOut: false, isAccrualExp: true }

    const CAT_INC = ['給与', 'ボーナス', '立替精算', '副業・臨時収入', 'その他収入'];

    let state = null;
    let ui = {
      tab: 'dashboard',

      txSearch: '',
      selectedTx: new Set(),
      fcSubTab: 'monthly', // 'monthly' | 'scheduled'

    /* ---------------------------------------------------------
       日付・通貨・リアルタイム3桁カンマ整形ユーティリティ
       --------------------------------------------------------- */
    const todayISO = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const curYM = () => todayISO().slice(0, 7);
    const addMonths = (ym, delta) => {
      const [y, m] = ym.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };
    const clampDate = (ym, day) => {
      const [y, m] = ym.split('-').map(Number);
      const maxD = new Date(y, m, 0).getDate();
      const dd = Math.min(Math.max(1, Number(day) || 1), maxD);
      return `${y}-${String(m).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
    };
    const fmtMonthJP = ym => {
      if (!ym) return '';
      const [y, m] = ym.split('-');
      return `${y}年${Number(m)}月`;
    };
    const fmtMonthShort = ym => {
      if (!ym) return '';
      const [y, m] = ym.split('-');
      return `${y.slice(2)}/${Number(m)}月`;
    };
    const fmtDate = iso => (iso ? iso.replace(/-/g, '/') : '未設定');
    const fmtYen = (n, showPlus = false) => {
      const v = Math.round(Number(n) || 0);
      const s = Math.abs(v).toLocaleString('ja-JP');
      if (v < 0) return `-¥${s}`;
      return showPlus && v > 0 ? `+¥${s}` : `¥${s}`;
    };
    const fmtNumStr = (n, allowNeg = false) => {
      const v = Math.round(Number(n) || 0);
      if (!allowNeg && v < 0) return '0';
      return v.toLocaleString('ja-JP');
    };
    const parseYen = (val, allowNeg = false) => {
      const half = String(val ?? '')
        .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/[−ー－]/g, '-')
        .trim();
      const neg = allowNeg && half.startsWith('-');
      const digits = half.replace(/[^\d]/g, '');
      if (!digits) return 0;
      const num = parseInt(digits, 10) || 0;
      return neg ? -num : num;
    };

    // リアルタイム3桁カンマ自動整形（全角数字対応・カーソル位置維持）
    function fmtComma(el, allowNeg = false) {
      if (!el) return;
      const raw = el.value;
      const pos = typeof el.selectionStart === 'number' ? el.selectionStart : raw.length;
      const norm = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[−ー－]/g, '-');
      const nRaw = norm(raw);
      const nLeft = norm(raw.slice(0, pos));
      const isNeg = allowNeg && nRaw.trimStart().startsWith('-');
      const digits = nRaw.replace(/[^\d]/g, '');
      if (!digits) {
        const out = isNeg ? '-' : '';
        if (el.value !== out) el.value = out;
        return;
      }
      const leftNeg = allowNeg && nLeft.trimStart().startsWith('-');
      const leftDigits = nLeft.replace(/[^\d]/g, '').length;
      const leadZeros = digits.length - digits.replace(/^0+(?=\d)/, '').length;
      const targetLeft = Math.max(0, leftDigits - leadZeros);
      const cleaned = digits.replace(/^0+(?=\d)/, '');
      const formatted = (isNeg ? '-' : '') + cleaned.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      if (el.value !== formatted) {
        el.value = formatted;
        let newPos = isNeg && leftNeg ? 1 : 0;
        let seen = 0;
        for (let i = (isNeg ? 1 : 0); i < formatted.length; i++) {
          if (seen >= targetLeft) break;
          if (/\d/.test(formatted[i])) seen++;
          newPos = i + 1;
        }
        try { el.setSelectionRange(newPos, newPos); } catch (_) {}
      }
    }

    const uid = (p = 'id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`;
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const nameOf = (arr, id) => (arr.find(x => x.id === id) || {}).name || '未設定';

    /* ---------------------------------------------------------
       データ初期化・永続化（localStorage + window.name）

          { id: 'tx_4', date: clampDate(ym, 14), type: 'provision_alloc', amount: 15000, provisionId: 'prov_travel', category: '特別費', memo: '旅行引当金へ積立' }
        ],

          { id: 'sch_sal', kind: 'income', title: '毎月の給与（手取り）', amount: 285000, freq: 'monthly', day: 25, startMonth: ym, endMonth: '', accountId: 'acc_bank', category: '給与', active: true, appliedMonths: [] },

    function createEmptyState() {
      return normalizeState({

    function normalizeState(raw) {
      const s = raw.settings || {};
      const validH = [1, 3, 6, 12];
      const validScope = ['this_month', '1', '2', '3', '6', '12'];
      return {
        accounts: Array.isArray(raw.accounts) && raw.accounts.length ? raw.accounts.map(a => ({

          id: l.id || uid('liab'), name: l.name || 'クレカ', balance: Math.max(0, Math.round(Number(l.balance) || 0)),
          dueDate: l.dueDate || clampDate(addMonths(curYM(), 1), 27), memo: l.memo || ''
        })) : [],
        provisions: Array.isArray(raw.provisions) ? raw.provisions.map(p => ({
          id: p.id || uid('prov'), name: p.name || '引当枠', balance: Math.round(Number(p.balance) || 0),
          target: Math.max(0, Math.round(Number(p.target) || 0)), memo: p.memo || ''
        })) : [],
        transactions: Array.isArray(raw.transactions) ? raw.transactions : [],
        scheduled: Array.isArray(raw.scheduled) ? raw.scheduled.map(x => ({
          ...x, id: x.id || uid('sch'), amount: Math.max(0, Math.round(Number(x.amount) || 0)),
          active: x.active !== false, appliedMonths: Array.isArray(x.appliedMonths) ? x.appliedMonths : []
        })) : [],
        settings: {
          dashIncludeIncome: !!s.dashIncludeIncome,
          dashIncomeScope: validScope.includes(String(s.dashIncomeScope)) ? String(s.dashIncomeScope) : 'this_month',
          horizon: validH.includes(Number(s.horizon)) ? Number(s.horizon) : 6,
          fcIncludeIncome: s.fcIncludeIncome !== false,
          fcIncludeVar: s.fcIncludeVar !== undefined ? !!s.fcIncludeVar : true,
          fcVarAmount: s.fcVarAmount !== undefined ? Math.max(0, Math.round(Number(s.fcVarAmount) || 0)) : 65000
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.accounts)) { state = normalizeState(parsed); return; }
        }
      } catch (_) {}
      try {
        if (typeof window.name === 'string' && window.name.startsWith(WIN_PREFIX)) {
          const parsed = JSON.parse(window.name.slice(WIN_PREFIX.length));
          if (parsed && Array.isArray(parsed.accounts)) { state = normalizeState(parsed); saveState(); return; }
        }
      } catch (_) {}
      state = createSampleState();
      saveState();
    }

    function saveState() {
      const json = JSON.stringify(state);
      try { localStorage.setItem(STORAGE_KEY, json); } catch (_) {}
      try { window.name = WIN_PREFIX + json; } catch (_) {}
    }

    /* ---------------------------------------------------------
       コア会計計算 & 取引適用／ロールバック
       --------------------------------------------------------- */
    function getTotals() {
      const cash = state.accounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);
      const liability = state.liabilities.reduce((s, l) => s + Math.max(0, Number(l.balance) || 0), 0);
      const provision = state.provisions.reduce((s, p) => s + (Number(p.balance) || 0), 0);
      const free = cash - liability - provision;
      return { cash, liability, provision, free };
    }

    // dir = +1 で適用、dir = -1 で完全ロールバック
    function applyTxEffect(tx, dir) {
      const amt = Math.round(Number(tx.amount) || 0) * dir;
      const acc = tx.accountId ? state.accounts.find(a => a.id === tx.accountId) : null;
      const liab = tx.liabilityId ? state.liabilities.find(l => l.id === tx.liabilityId) : null;
      const prov = tx.provisionId ? state.provisions.find(p => p.id === tx.provisionId) : null;

      if (tx.type === 'income') {
        if (acc) acc.balance += amt;
      } else if (tx.type === 'expense_cash') {
        if (acc) acc.balance -= amt;
      } else if (tx.type === 'expense_credit') {
        if (liab) liab.balance += amt;
      } else if (tx.type === 'settlement') {
        if (acc) acc.balance -= amt;
        if (liab) liab.balance -= amt;
      } else if (tx.type === 'provision_alloc') {
        if (prov) prov.balance += amt;
      } else if (tx.type === 'expense_provision_cash') {
        if (prov) prov.balance -= amt;
        if (acc) acc.balance -= amt;
      } else if (tx.type === 'expense_provision_credit') {
        if (prov) prov.balance -= amt;
        if (liab) liab.balance += amt;
      }
    }

    function occursInMonth(item, ym) {
      if (!item.active) return false;
      if ((item.appliedMonths || []).includes(ym)) return false;
      if (item.freq === 'once') return (item.date || '').slice(0, 7) === ym;
      return (!item.startMonth || ym >= item.startMonth) && (!item.endMonth || ym <= item.endMonth);
    }

    function getScopeIncome(scope) {
      const ym0 = curYM();
      const maxOffset = scope === 'this_month' ? 0 : Math.max(1, Number(scope) || 1);
      const labels = { this_month: '今月残り', '1': '1ヶ月先まで', '2': '2ヶ月先まで', '3': '3ヶ月先まで', '6': '6ヶ月先まで', '12': '1年先まで' };
      let total = 0, count = 0;
      for (let i = 0; i <= maxOffset; i++) {
        const ym = addMonths(ym0, i);
        state.scheduled.forEach(item => {
          if (item.kind === 'income' && occursInMonth(item, ym)) {
            total += item.amount;
            count++;
          }
        });
      }
      return { total, count, label: labels[String(scope)] || '今月残り' };
    }

    /* ---------------------------------------------------------
       将来予測エンジン（1ヶ月・3ヶ月・6ヶ月・1年）
       --------------------------------------------------------- */
    function computeForecast(horizonOverride = null) {
      const set = state.settings;
      const horizon = horizonOverride ?? set.horizon;
      const totals = getTotals();
      const ym0 = curYM();

      let runCash = totals.cash;
      let runFree = totals.free;
      const provMap = {};
      state.provisions.forEach(p => { provMap[p.id] = p.balance; });
      let runProv = totals.provision;

      // 今月実績の変動費合計（変動費見込みの二重計上を防止）
      const fixedCats = ['住居・家賃', '通信・光熱費'];
      const spentVarCur = state.transactions
        .filter(t => (t.date || '').startsWith(ym0) && (t.type === 'expense_cash' || t.type === 'expense_credit') && !fixedCats.includes(t.category) && !t.sourceScheduledId)
        .reduce((s, t) => s + (Number(t.amount) || 0), 0);

      const months = [];
      for (let i = 0; i <= horizon; i++) {
        const ym = addMonths(ym0, i);
        let mInc = 0, mExp = 0, mSettle = 0, mRes = 0;
        const lines = [];

        // 1. 確定負債の引き落とし予定（手元キャッシュのみ減額し、実質フリーからは二重控除しない）
        state.liabilities.forEach(l => {
          if (l.balance <= 0) return;
          const dueYm = (l.dueDate || '').slice(0, 7);
          const effYm = dueYm && dueYm >= ym0 ? dueYm : ym0;
          if (effYm === ym) {
            runCash -= l.balance;
            mSettle += l.balance;
            lines.push({
              kind: 'settlement', dateLabel: (l.dueDate || '').slice(5).replace('-', '/') || '予定',
              title: `${l.name} 引落予定`, note: '手元キャッシュのみ減少（実質フリー控除済）',
              amount: l.balance, freeDelta: 0, schedId: null
            });
          }
        });

        // 2. 予定収支（予定収入・予定支出・定期引当）
        state.scheduled.forEach(item => {
          if (!occursInMonth(item, ym)) return;
          const dLbl = item.freq === 'once' ? (item.date || '').slice(5).replace('-', '/') : clampDate(ym, item.day).slice(5).replace('-', '/');
          if (item.kind === 'income') {
            if (!set.fcIncludeIncome) return;
            runCash += item.amount;
            runFree += item.amount;
            mInc += item.amount;
            lines.push({
              kind: 'income', dateLabel: dLbl, title: item.title,
              note: `入金先: ${nameOf(state.accounts, item.accountId)}`,
              amount: item.amount, freeDelta: item.amount, schedId: item.id, canApply: i === 0
            });
          } else if (item.kind === 'reserve') {
            runFree -= item.amount;
            runProv += item.amount;
            if (item.provisionId) provMap[item.provisionId] = (provMap[item.provisionId] || 0) + item.amount;
            mRes += item.amount;
            lines.push({
              kind: 'reserve', dateLabel: dLbl, title: item.title,
              note: `積立先: ${nameOf(state.provisions, item.provisionId)}`,
              amount: item.amount, freeDelta: -item.amount, schedId: item.id, canApply: i === 0
            });
          } else if (item.kind === 'expense') {
            runCash -= item.amount;
            mExp += item.amount;
            if (item.useProvisionId && provMap[item.useProvisionId] !== undefined) {
              const avail = Math.max(0, provMap[item.useProvisionId]);
              const used = Math.min(avail, item.amount);
              const short = item.amount - used;
              provMap[item.useProvisionId] -= used;
              runProv -= used;
              runFree -= short;
              const pn = nameOf(state.provisions, item.useProvisionId);
              lines.push({
                kind: 'expense', dateLabel: dLbl, title: item.title,
                note: short > 0 ? `引当「${pn}」${fmtYen(used)}充当 ／ 不足${fmtYen(short)}はフリーから` : `引当「${pn}」から全額充当（実質フリー不変）`,
                amount: item.amount, freeDelta: -short, schedId: item.id, canApply: i === 0
              });
            } else {
              runFree -= item.amount;
              lines.push({
                kind: 'expense', dateLabel: dLbl, title: item.title,
                note: `${item.category || '予定支出'} • ${nameOf(state.accounts, item.accountId)}`,
                amount: item.amount, freeDelta: -item.amount, schedId: item.id, canApply: i === 0
              });
            }
          }
        });

        // 3. 毎月の変動費見込み
        if (set.fcIncludeVar && set.fcVarAmount > 0) {
          const vAmt = i === 0 ? Math.max(0, set.fcVarAmount - spentVarCur) : set.fcVarAmount;
          if (vAmt > 0) {
            runCash -= vAmt;
            runFree -= vAmt;
            mExp += vAmt;
            lines.push({
              kind: 'variable', dateLabel: i === 0 ? '今月残' : '月間',
              title: i === 0 ? '今月残りの変動費見込み' : '毎月の変動費見込み',
              note: i === 0 ? `月予算 ${fmtYen(set.fcVarAmount)} − 今月実績 ${fmtYen(spentVarCur)}` : '食費・日用品などの平均予算',
              amount: vAmt, freeDelta: -vAmt, schedId: null
            });
          }
        }

        lines.sort((a, b) => a.dateLabel.localeCompare(b.dateLabel));
        months.push({ ym, endCash: runCash, endFree: runFree, endProv: runProv, mInc, mExp, mSettle, mRes, lines });
      }
      return months;
    }

    /* ---------------------------------------------------------
       共通3段構造カード：予定収入・予定収支レンダラー
       （1段目: スイッチ+タイトル+金額 / 2段目: 周期+口座 / 3段目: 操作ボタン）

        expense: { bCls: 'b-slate', lbl: '予定支出', sign: '-', amtCls: '' },
        reserve: { bCls: 'b-amber', lbl: '定期引当', sign: '', amtCls: 'text-amber' }
      }[item.kind] || { bCls: 'b-slate', lbl: item.kind, sign: '', amtCls: '' };

      let metaDetail = '';
      if (item.kind === 'income') {

      } else if (item.kind === 'reserve') {

          ? `引当充当: ${esc(nameOf(state.provisions, item.useProvisionId))}`

      }

      return `
        <div class="sched-card ${item.active ? '' : 'inactive'}">
          <!-- 1段目：トグルスイッチ＋タイトル（左） ／ 金額（右・折り返しなし） -->
          <div class="sched-row-top">
            <div class="sched-top-left">
              <button type="button" class="switch ${item.active ? 'on' : ''}" onclick="toggleSchedActive('${item.id}')" aria-label="予測に含めるON/OFF"></button>
              <div class="sched-title">${esc(item.title)}</div>
            </div>
            <div class="sched-amount nums ${km.amtCls}">${km.sign}${fmtYen(item.amount)}</div>
          </div>

          <!-- 2段目：周期・日付バッジ＋口座・引当情報 -->
          <div class="sched-row-meta">
            ${showKindBadge ? `<span class="badge ${km.bCls}">${km.lbl}</span>` : ''}
            <span class="badge b-slate nums">${esc(cycleText)}</span>
            ${applied ? `<span class="badge b-indigo">${fmtMonthShort(targetYm)} 実績反映済</span>` : ''}
            <span>${metaDetail}</span>
          </div>

          <!-- 3段目：操作ボタン群（独立段・重なりゼロ） -->
          <div class="sched-row-actions">
            ${!applied
              ? `<button type="button" class="btn btn-soft-emerald btn-xs" onclick="applySchedToActual('${item.id}','${targetYm}')">実績反映</button>`
              : `<button type="button" class="btn btn-soft btn-xs" onclick="unmarkSchedApplied('${item.id}','${targetYm}')">反映戻す</button>`}
            <button type="button" class="btn btn-soft-indigo btn-xs" onclick="openSchedModal(null,'${item.id}')">編集</button>
            <button type="button" class="btn btn-soft-red btn-xs" onclick="confirmDeleteSched('${item.id}')">取消</button>
          </div>
        </div>
      `;
    }

    function switchTab(tab) {

      document.querySelectorAll('.tab-view').forEach(el => el.classList.toggle('hidden', el.id !== `view-${tab}`));
      document.querySelectorAll('#pc-nav .nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      document.querySelectorAll('#mobile-nav .mnav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderAll() {
      const t = getTotals();
      const set = state.settings;
      const incInfo = getScopeIncome(set.dashIncomeScope);
      const sbFree = set.dashIncludeIncome ? t.free + incInfo.total : t.free;
      document.getElementById('sb-free-lbl').textContent = set.dashIncludeIncome ? `実質フリー（${incInfo.label}込）` : '現在の実質フリー資金';
      const sbVal = document.getElementById('sb-free-val');

    function setDashIncomeMode(on) { state.settings.dashIncludeIncome = !!on; saveState(); renderAll(); }

    /* ---------------------------------------------------------
       TAB 2: 履歴（上下段レイアウト・複数選択一括削除・完全ロールバック）
       --------------------------------------------------------- */
    function getFilteredTransactions() {
      const kw = ui.txSearch.trim().toLowerCase();
      return state.transactions.filter(tx => {
        const meta = TX_TYPES[tx.type] || {};
        if (ui.txFilter === 'actual' && !meta.isActual) return false;
        if (ui.txFilter === 'income' && tx.type !== 'income') return false;
        if (ui.txFilter === 'expense_cash' && tx.type !== 'expense_cash') return false;
        if (ui.txFilter === 'expense_credit' && tx.type !== 'expense_credit') return false;
        if (ui.txFilter === 'settlement' && tx.type !== 'settlement') return false;
        if (ui.txFilter === 'provision_alloc' && tx.type !== 'provision_alloc') return false;
        if (ui.txFilter === 'expense_provision' && !['expense_provision_cash', 'expense_provision_credit'].includes(tx.type)) return false;
        if (kw) {
          const hay = [tx.memo, tx.category, txTargetLabel(tx)].join(' ').toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      }).sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id.localeCompare(a.id));
    }

    function txTargetLabel(tx) {
      if (tx.type === 'income' || tx.type === 'expense_cash') return nameOf(state.accounts, tx.accountId);
      if (tx.type === 'expense_credit') return nameOf(state.liabilities, tx.liabilityId);
      if (tx.type === 'settlement') return `${nameOf(state.accounts, tx.accountId)} → ${nameOf(state.liabilities, tx.liabilityId)}`;
      if (tx.type === 'provision_alloc') return nameOf(state.provisions, tx.provisionId);
      if (tx.type === 'expense_provision_cash') return `${nameOf(state.provisions, tx.provisionId)} (${nameOf(state.accounts, tx.accountId)})`;
      if (tx.type === 'expense_provision_credit') return `${nameOf(state.provisions, tx.provisionId)} (${nameOf(state.liabilities, tx.liabilityId)})`;
      return '';
    }

    function txRowHTML(tx, withCheck) {
      const m = TX_TYPES[tx.type] || { label: tx.type, color: 'b-slate', sign: '', cls: '' };
      const checked = withCheck && ui.selectedTx.has(tx.id);
      return `
        <div class="tx-row ${checked ? 'selected' : ''}">
          <!-- 上段：チェック＋タイトル（左） ／ 金額（右・nowrap） -->
          <div class="tx-row-top">
            <div class="tx-row-left">
              ${withCheck ? `<input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleTxSelect('${tx.id}',this.checked)" aria-label="取引を選択" />` : ''}
              <div class="tx-row-title">${esc(tx.memo || tx.category || m.label)}</div>
            </div>
            <strong class="nums nowrap ${m.cls}" style="font-size:15px;">${m.sign}${fmtYen(tx.amount)}</strong>
          </div>
          <!-- 下段：日付・種別バッジ・対象口座 ／ 削除ボタン -->
          <div class="tx-row-bottom">
            <div class="tx-row-meta">
              <span class="nums" style="font-weight:700;">${fmtDate(tx.date)}</span>
              <span class="badge ${m.color}">${m.label}</span>
              <span>${esc(tx.category || '')} • ${esc(txTargetLabel(tx))}</span>
            </div>
            <button type="button" class="btn btn-soft-red btn-xs" onclick="confirmDeleteTx(['${tx.id}'])" title="削除（残高ロールバック）">削除</button>
          </div>
        </div>
      `;
    }

    function renderTransactions() {
      const list = getFilteredTransactions();
      const existIds = new Set(state.transactions.map(t => t.id));
      [...ui.selectedTx].forEach(id => { if (!existIds.has(id)) ui.selectedTx.delete(id); });

      const selCount = ui.selectedTx.size;
      const visibleIds = list.map(t => t.id);
      const allVisSelected = visibleIds.length > 0 && visibleIds.every(id => ui.selectedTx.has(id));
      const sumAmt = list.reduce((s, t) => s + (Number(t.amount) || 0), 0);

      document.getElementById('view-transactions').innerHTML = `
        <div class="page-head">
          <div>
            <h2 class="page-title">取引履歴</h2>
            <p class="page-desc">チェックで複数選択・一括削除可能。削除時は口座・負債・引当残高を自動で元に戻します</p>
          </div>
          <button type="button" class="btn btn-primary btn-sm" onclick="openTxModal()">＋ 取引を記録</button>
        </div>

        <div class="card card-tight" style="display:flex;flex-direction:column;gap:10px;">
          <div class="row wrap" style="gap:6px;">
            ${[
              ['all', 'すべて'],
              ['actual', '実際キャッシュフローのみ'],
              ['income', '収入'],
              ['expense_cash', '現金支出'],
              ['expense_credit', 'クレカ支出'],
              ['settlement', '負債精算'],
              ['provision_alloc', '引当積立'],
              ['expense_provision', '引当から支出']
            ].map(([k, l]) => `
              <button type="button" class="btn btn-xs ${ui.txFilter === k ? 'btn-primary' : 'btn-soft'}" onclick="setTxFilter('${k}')">${l}</button>
            `).join('')}
          </div>
          <div class="row-between">
            <input type="text" class="input" style="max-width:300px;padding:7px 11px;font-size:13px;" value="${esc(ui.txSearch)}" placeholder="メモ・カテゴリ・口座名で検索" oninput="ui.txSearch=this.value;renderTransactions();" />
            <div class="nums" style="font-size:12px;color:var(--text-sub);">
              表示 <strong>${list.length}件</strong> ／ 合計 <strong>${fmtYen(sumAmt)}</strong>
            </div>
          </div>
        </div>

        ${selCount > 0 ? `
          <div class="bulk-bar">
            <strong class="nums" style="font-size:13.5px;">✓ ${selCount}件選択中</strong>
            <div class="row wrap" style="gap:6px;">
              <button type="button" class="btn btn-xs" style="background:rgba(255,255,255,0.16);color:#fff;" onclick="selectAllVisibleTx()">すべて選択</button>
              <button type="button" class="btn btn-xs" style="background:rgba(255,255,255,0.16);color:#fff;" onclick="clearTxSelection()">解除</button>
              <button type="button" class="btn btn-red btn-xs" onclick="confirmDeleteTx([...ui.selectedTx])">一括削除 (${selCount}件)</button>
            </div>
          </div>
        ` : ''}

        <div class="list-box">
          <div class="list-head">
            <label class="row" style="cursor:pointer;font-weight:700;color:var(--text);">
              <input type="checkbox" ${allVisSelected ? 'checked' : ''} onchange="toggleAllVisibleTx(this.checked)" />
              <span>表示中の取引をすべて選択</span>
            </label>
            <span style="font-size:11px;">削除時は残高を自動ロールバック</span>
          </div>
          ${list.length === 0 ? `<div class="empty">条件に一致する取引履歴はありません</div>` : list.map(tx => txRowHTML(tx, true)).join('')}
        </div>
      `;
    }

    function setTxFilter(f) { ui.txFilter = f; ui.selectedTx.clear(); renderTransactions(); }
    function toggleTxSelect(id, chk) { if (chk) ui.selectedTx.add(id); else ui.selectedTx.delete(id); renderTransactions(); }
    function toggleAllVisibleTx(chk) {
      if (chk) getFilteredTransactions().forEach(t => ui.selectedTx.add(t.id));
      else ui.selectedTx.clear();
      renderTransactions();
    }
    function selectAllVisibleTx() { getFilteredTransactions().forEach(t => ui.selectedTx.add(t.id)); renderTransactions(); }
    function clearTxSelection() { ui.selectedTx.clear(); renderTransactions(); }

    function confirmDeleteTx(ids) {
      if (!ids || !ids.length) return;
      openConfirm(
        ids.length === 1 ? 'この取引を削除しますか？' : `選択した${ids.length}件の取引を一括削除しますか？`,
        '削除すると、取引種別に応じて口座残高・負債残高・引当金残高が自動で元へロールバックされます。',
        () => {
          const delSet = new Set(ids);
          const toDelete = state.transactions.filter(t => delSet.has(t.id));
          toDelete.forEach(tx => {
            applyTxEffect(tx, -1);
            if (tx.sourceScheduledId && tx.sourceMonth) {
              const sc = state.scheduled.find(s => s.id === tx.sourceScheduledId);
              if (sc) sc.appliedMonths = (sc.appliedMonths || []).filter(m => m !== tx.sourceMonth);
            }
          });
          state.transactions = state.transactions.filter(t => !delSet.has(t.id));
          ids.forEach(id => ui.selectedTx.delete(id));
          saveState();
          renderAll();
          showToast(toDelete.length === 1 ? '取引を削除し残高を元に戻しました' : `${toDelete.length}件を一括削除し残高を元に戻しました`);
        }
      );
    }

                              <button type="button" class="btn btn-soft-indigo btn-xs" onclick="openSchedModal(null,'${li.schedId}')">編集</button>

        <div class="${ui.fcSubTab === 'scheduled' ? '' : 'hidden'} card">
          <div class="row wrap" style="margin-bottom:12px;gap:6px;">

              `<button type="button" class="btn btn-xs ${ui.schedFilter === k ? 'btn-primary' : 'btn-soft'}" onclick="ui.schedFilter='${k}';renderForecast();">${l}</button>`
            ).join('')}

          ${schedList.length === 0
            ? `<div class="empty">該当する予定項目はありません。上のボタンから追加できます。</div>`

    // 軽量インラインSVG 2本線推移グラフ生成
    function buildDualLineSVG(pts, focusIdx) {
      const W = 700, H = 230, padL = 56, padR = 20, padT = 18, padB = 34;
      const plotW = W - padL - padR, plotH = H - padT - padB;
      const allVals = pts.flatMap(p => [p.cash, p.free]).concat([0]);
      let minV = Math.min(...allVals), maxV = Math.max(...allVals);
      if (maxV === minV) { maxV += 100000; minV -= 50000; }
      const margin = (maxV - minV) * 0.14;
      maxV += margin; minV -= margin;

      const xOf = i => padL + (pts.length === 1 ? plotW / 2 : (i / (pts.length - 1)) * plotW);
      const yOf = v => padT + ((maxV - v) / (maxV - minV)) * plotH;
      const y0 = yOf(0);

      let gridHTML = '';
      for (let g = 0; g <= 4; g++) {
        const val = maxV - ((maxV - minV) * g) / 4;
        const y = yOf(val);
        const lbl = Math.abs(val) >= 10000 ? `${Math.round(val / 10000)}万` : `${Math.round(val)}`;
        gridHTML += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
        gridHTML += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#64748b">${lbl}</text>`;
      }

      const negRect = y0 < padT + plotH
        ? `<rect x="${padL}" y="${Math.max(padT, y0)}" width="${plotW}" height="${Math.max(0, padT + plotH - Math.max(padT, y0))}" fill="rgba(220,38,38,0.06)"/>`
        : '';
      const zeroLine = (y0 >= padT && y0 <= padT + plotH)
        ? `<line x1="${padL}" y1="${y0}" x2="${W - padR}" y2="${y0}" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4 4"/>`
        : '';

      const cashPath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${xOf(i).toFixed(1)},${yOf(p.cash).toFixed(1)}`).join(' ');
      const freePath = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${xOf(i).toFixed(1)},${yOf(p.free).toFixed(1)}`).join(' ');
      const baseClampY = Math.min(padT + plotH, Math.max(padT, y0));
      const freeArea = `${freePath} L${xOf(pts.length - 1).toFixed(1)},${baseClampY.toFixed(1)} L${xOf(0).toFixed(1)},${baseClampY.toFixed(1)} Z`;

      const step = pts.length > 8 ? 2 : 1;
      const dotsAndHits = pts.map((p, i) => {
        const x = xOf(i), yc = yOf(p.cash), yf = yOf(p.free);
        const isFoc = i === focusIdx;
        const showLbl = i === 0 || i === pts.length - 1 || i % step === 0;
        const hitW = Math.max(26, plotW / pts.length);
        return `
          ${isFoc ? `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
          <circle cx="${x}" cy="${yc}" r="${isFoc ? 5 : 3.5}" fill="#4f46e5" stroke="#fff" stroke-width="1.5"/>
          <circle cx="${x}" cy="${yf}" r="${isFoc ? 5.5 : 4}" fill="${p.free < 0 ? '#dc2626' : '#059669'}" stroke="#fff" stroke-width="1.5"/>
          ${showLbl ? `<text x="${x}" y="${H - 10}" text-anchor="middle" font-size="11" font-weight="${isFoc ? '800' : '600'}" fill="${isFoc ? '#0f172a' : '#64748b'}">${esc(p.label)}</text>` : ''}
          <rect x="${x - hitW / 2}" y="${padT}" width="${hitW}" height="${plotH + 22}" fill="transparent" style="cursor:pointer;" onmouseenter="focusChartPoint(${i})" onclick="focusChartPoint(${i})"/>
        `;
      }).join('');

      return `
        <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="月末残高推移グラフ">
          ${gridHTML}${negRect}${zeroLine}
          <path d="${freeArea}" fill="rgba(5,150,105,0.10)"/>
          <path d="${cashPath}" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="${freePath}" fill="none" stroke="#059669" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
          ${dotsAndHits}
        </svg>
      `;
    }

    function focusChartPoint(idx) { ui.chartFocusIdx = idx; renderForecast(); }
    function setForecastHorizon(h) { state.settings.horizon = h; ui.lookupMonth = addMonths(curYM(), h); ui.chartFocusIdx = null; saveState(); renderForecast(); }
    function setForecastInc(on) { state.settings.fcIncludeIncome = !!on; saveState(); renderForecast(); }
    function setForecastVarToggle(chk) { state.settings.fcIncludeVar = !!chk; saveState(); renderForecast(); }
    function updateForecastVarAmount(val) {
      state.settings.fcVarAmount = Math.max(0, parseYen(val));
      saveState();
      clearTimeout(window._fcTimer);
      window._fcTimer = setTimeout(() => {
        const hadFocus = document.activeElement && document.activeElement.id === 'fc-var-input';
        renderForecast();
        if (hadFocus) {
          const inp = document.getElementById('fc-var-input');
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }
      }, 320);
    }
    function toggleMonthExpand(ym) {
      if (ui.expandedMonths.has(ym)) ui.expandedMonths.delete(ym);
      else ui.expandedMonths.add(ym);
      renderForecast();
    }

    /* ---------------------------------------------------------
       予定収支アクション（ON/OFF・実績反映・取消）
       --------------------------------------------------------- */
    function toggleSchedActive(id) {
      const it = state.scheduled.find(x => x.id === id);
      if (!it) return;
      it.active = !it.active;
      saveState();
      renderAll();
      showToast(it.active ? `「${it.title}」を予測に含めました` : `「${it.title}」を予測からOFFにしました`);
    }

    function applySchedToActual(id, targetYm) {
      const it = state.scheduled.find(x => x.id === id);
      if (!it) return;
      const applied = it.appliedMonths || [];
      if (applied.includes(targetYm)) { showToast('この月はすでに実績へ反映済みです', true); return; }

      const txDate = it.freq === 'once' ? (it.date || todayISO()) : clampDate(targetYm, it.day);
      const accId = (state.accounts.find(a => a.id === it.accountId) || state.accounts[0]).id;
      let tx = null;

      if (it.kind === 'income') {
        tx = { id: uid('tx'), date: txDate, type: 'income', amount: it.amount, accountId: accId, category: it.category || '給与', memo: `${it.title}（予定反映）`, sourceScheduledId: it.id, sourceMonth: targetYm };
      } else if (it.kind === 'expense') {
        if (it.useProvisionId && state.provisions.some(p => p.id === it.useProvisionId)) {
          tx = { id: uid('tx'), date: txDate, type: 'expense_provision_cash', amount: it.amount, accountId: accId, provisionId: it.useProvisionId, category: it.category || '特別費', memo: `${it.title}（予定反映）`, sourceScheduledId: it.id, sourceMonth: targetYm };
        } else {
          tx = { id: uid('tx'), date: txDate, type: 'expense_cash', amount: it.amount, accountId: accId, category: it.category || 'その他', memo: `${it.title}（予定反映）`, sourceScheduledId: it.id, sourceMonth: targetYm };
        }
      } else if (it.kind === 'reserve') {
        const pId = (state.provisions.find(p => p.id === it.provisionId) || state.provisions[0] || {}).id;
        if (!pId) { showToast('積立先の引当枠がありません', true); return; }
        tx = { id: uid('tx'), date: txDate, type: 'provision_alloc', amount: it.amount, provisionId: pId, category: '特別費', memo: `${it.title}（予定反映）`, sourceScheduledId: it.id, sourceMonth: targetYm };
      }

      if (tx) {
        state.transactions.push(tx);
        applyTxEffect(tx, +1);
        it.appliedMonths = [...applied, targetYm];
        saveState();
        renderAll();
        showToast(`「${it.title}」(${fmtYen(it.amount)}) を実績に反映しました`);
      }
    }

    function unmarkSchedApplied(id, targetYm) {
      const it = state.scheduled.find(x => x.id === id);
      if (!it) return;
      it.appliedMonths = (it.appliedMonths || []).filter(m => m !== targetYm);
      saveState();
      renderAll();
      showToast(`${fmtMonthShort(targetYm)}の反映済マークを解除しました`);
    }

    function confirmDeleteSched(id) {
      const it = state.scheduled.find(x => x.id === id);
      if (!it) return;
      openConfirm(
        `予定「${it.title}」を取り消しますか？`,
        'この予定項目を削除し、将来予測および収入予測から除外します（実績反映済みの取引履歴はそのまま残ります）。',
        () => {
          state.scheduled = state.scheduled.filter(x => x.id !== id);
          saveState();
          renderAll();
          showToast(`予定「${it.title}」を取り消しました`);
        }
      );
    }

    /* ---------------------------------------------------------
       モーダル＆確認ダイアログ＆トースト（alert/confirm不使用）
       --------------------------------------------------------- */
    function openModalHTML(html, sizeClass = '') {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${sizeClass}">${html}</div></div>`;
      root.classList.remove('hidden');
    }
    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.innerHTML = '';
    }

    let _confirmCb = null;
    function openConfirm(title, msg, onOk) {
      _confirmCb = onOk;
      const root = document.getElementById('confirm-root');
      root.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeConfirm()">
          <div class="modal modal-sm">
            <div class="modal-head"><h3>${esc(title)}</h3></div>
            <div class="modal-body"><p style="font-size:13px;color:var(--text-sub);">${esc(msg)}</p></div>
            <div class="modal-foot">
              <button type="button" class="btn btn-soft btn-sm" onclick="closeConfirm()">キャンセル</button>
              <button type="button" class="btn btn-red btn-sm" onclick="runConfirm()">実行する</button>
            </div>
          </div>
        </div>
      `;
      root.classList.remove('hidden');
    }
    function closeConfirm() {
      const root = document.getElementById('confirm-root');
      root.classList.add('hidden');
      root.innerHTML = '';
      _confirmCb = null;
    }
    function runConfirm() {
      const fn = _confirmCb;
      closeConfirm();
      if (typeof fn === 'function') fn();
    }

    function showToast(msg, isErr = false) {
      const wrap = document.getElementById('toast-wrap');
      const div = document.createElement('div');
      div.className = `toast ${isErr ? 'err' : ''}`;
      div.textContent = msg;
      wrap.appendChild(div);
      setTimeout(() => div.remove(), 2800);
    }

    /* ---------------------------------------------------------
       MODAL 1: 取引登録（全7種別）
       --------------------------------------------------------- */
    function openTxModal(defaultType = 'expense_cash', presetLiabId = null, presetProvId = null) {
      if (['expense_credit', 'settlement', 'expense_provision_credit'].includes(defaultType) && state.liabilities.length === 0) {

      }

      openModalHTML(`
        <div class="modal-head">
          <h3>取引を記録</h3>
          <button type="button" class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="submitTx(event)">
          <div class="modal-body">
            <div class="field">
              <label>取引種別</label>
              <select id="m-tx-type" class="select" onchange="updateTxFormUI()">

                <option value="expense_credit" ${state.liabilities.length === 0 ? 'disabled' : ''}>クレカ・後払い支出</option>

                <option value="settlement" ${state.liabilities.length === 0 ? 'disabled' : ''}>負債の引き落とし精算</option>
                <option value="provision_alloc" ${state.provisions.length === 0 ? 'disabled' : ''}>引当金へ積立</option>
                <option value="expense_provision_cash" ${state.provisions.length === 0 ? 'disabled' : ''}>引当から支出（現金・口座）</option>
                <option value="expense_provision_credit" ${state.provisions.length === 0 || state.liabilities.length === 0 ? 'disabled' : ''}>引当から支出（クレカ）</option>
              </select>
            </div>
            <div id="m-tx-banner" class="info-banner"></div>
            <div class="grid-2">
              <div class="field">
                <label>金額 (円)</label>
                <div class="input-yen-wrap">
                  <span>¥</span>
                  <input type="text" inputmode="numeric" id="m-tx-amt" class="input" required placeholder="0" oninput="fmtComma(this);updateTxFormUI()" />
                </div>
              </div>
              <div class="field">

              <label>対象のカード・負債</label>
              <select id="m-tx-liab" class="select">
                ${state.liabilities.map(l => `<option value="${l.id}" ${l.id === presetLiabId ? 'selected' : ''}>${esc(l.name)} (残 ${fmtYen(l.balance)})</option>`).join('')}
              </select>
            </div>
            <div id="m-tx-prov-wrap" class="field hidden">
              <label>対象の引当金枠</label>
              <select id="m-tx-prov" class="select">
                ${state.provisions.map(p => `<option value="${p.id}" ${p.id === presetProvId ? 'selected' : ''}>${esc(p.name)} (残 ${fmtYen(p.balance)})</option>`).join('')}
              </select>

                <label>カテゴリ</label>
                <select id="m-tx-cat" class="select"></select>

                <label>メモ</label>

          </div>
        </form>
      `);

      document.getElementById('m-tx-type').value = defaultType;
      updateTxFormUI(true);
      setTimeout(() => { const el = document.getElementById('m-tx-amt'); if (el) el.focus(); }, 40);
    }

    function updateTxFormUI(resetCats = false) {
      const type = document.getElementById('m-tx-type').value;
      const amt = parseYen(document.getElementById('m-tx-amt').value);
      const s = amt > 0 ? fmtYen(amt) : '入力額';

      const needAcc = ['income', 'expense_cash', 'settlement', 'expense_provision_cash'].includes(type);
      const needLiab = ['expense_credit', 'settlement', 'expense_provision_credit'].includes(type);
      const needProv = ['provision_alloc', 'expense_provision_cash', 'expense_provision_credit'].includes(type);

      document.getElementById('m-tx-acc-wrap').classList.toggle('hidden', !needAcc);
      document.getElementById('m-tx-liab-wrap').classList.toggle('hidden', !needLiab);
      document.getElementById('m-tx-prov-wrap').classList.toggle('hidden', !needProv);

      const catSel = document.getElementById('m-tx-cat');
      const curCat = catSel.value;
      const cats = type === 'income' ? CAT_INC : (type === 'settlement' ? ['負債精算'] : (type === 'provision_alloc' ? ['引当積立', '特別費'] : CAT_EXP));
      if (resetCats || !cats.includes(curCat)) {
        catSel.innerHTML = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      }

      const b = document.getElementById('m-tx-banner');
      const map = {
        income: ['emerald', `手元キャッシュ <strong>+${s}</strong> ／ 実質フリー <strong>+${s}</strong>`],
        expense_cash: ['', `手元キャッシュ <strong>-${s}</strong> ／ 実質フリー <strong>-${s}</strong>`],
        expense_credit: ['red', `手元キャッシュ不変 ／ 確定負債 <strong>+${s}</strong> ／ 実質フリーから即 <strong>-${s}</strong>`],
        settlement: ['indigo', `手元キャッシュ <strong>-${s}</strong> と確定負債 <strong>-${s}</strong> が相殺（<strong>実質フリー不変</strong>）`],
        provision_alloc: ['amber', `手元キャッシュ不変 ／ 引当残高 <strong>+${s}</strong> ／ 実質フリー <strong>-${s}</strong>`],
        expense_provision_cash: ['amber', `引当残高 <strong>-${s}</strong>・手元キャッシュ <strong>-${s}</strong>（<strong>実質フリー不変</strong>）`],
        expense_provision_credit: ['amber', `引当残高 <strong>-${s}</strong>・確定負債 <strong>+${s}</strong>（<strong>実質フリー不変</strong>）`]
      };
      const [cls, html] = map[type] || ['', ''];
      b.className = `info-banner ${cls}`;
      b.innerHTML = html;
    }

    function submitTx(e) {
      e.preventDefault();
      const type = document.getElementById('m-tx-type').value;
      const amount = parseYen(document.getElementById('m-tx-amt').value);
      const date = document.getElementById('m-tx-date').value;
      if (amount <= 0) { showToast('1円以上の金額を入力してください', true); return; }

      const tx = {
        id: uid('tx'), date, type, amount,
        category: document.getElementById('m-tx-cat').value,
        memo: document.getElementById('m-tx-memo').value.trim()
      };
      if (['income', 'expense_cash', 'settlement', 'expense_provision_cash'].includes(type)) tx.accountId = document.getElementById('m-tx-acc').value;
      if (['expense_credit', 'settlement', 'expense_provision_credit'].includes(type)) tx.liabilityId = document.getElementById('m-tx-liab').value;
      if (['provision_alloc', 'expense_provision_cash', 'expense_provision_credit'].includes(type)) tx.provisionId = document.getElementById('m-tx-prov').value;

      state.transactions.push(tx);
      applyTxEffect(tx, +1);
      saveState();
      closeModal();
      renderAll();
      showToast('取引を記録しました');
    }

    /* ---------------------------------------------------------
       MODAL 2: 負債・クレカの追加・金額編集（リアルタイム影響表示）
       --------------------------------------------------------- */
    function openLiabModal(editId = null) {

          <button type="button" class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="submitLiab(event,'${editId || ''}')">
          <div class="modal-body">
            <div class="field">
              <label>名称</label>
              <input type="text" id="m-liab-name" class="input" required value="${esc(l ? l.name : '')}" placeholder="例：楽天カード（翌月引落）" />
            </div>
            <div class="field">
              <label>負債金額（残高・円）</label>
              <div class="input-yen-wrap">
                <span>¥</span>

              <label>引き落とし予定日</label>
              <input type="date" id="m-liab-due" class="input" required value="${defaultDue}" />
            </div>
            <div class="field">
              <label>メモ（任意）</label>
              <input type="text" id="m-liab-memo" class="input" value="${esc(l ? l.memo : '')}" placeholder="確定明細に合わせて金額調整など" />
            </div>
          </div>
          <div class="modal-foot">

            <button type="submit" class="btn btn-primary btn-sm">保存する</button>
          </div>
        </form>
      `);
      previewLiabEdit(orig);
    }

    function previewLiabEdit(orig) {
      const next = Math.max(0, parseYen(document.getElementById('m-liab-amt').value));
      const diff = next - orig;
      const freeImp = -diff;
      const el = document.getElementById('m-liab-prev');
      el.className = `info-banner ${freeImp < 0 ? 'red' : (freeImp > 0 ? 'emerald' : '')}`;
      el.innerHTML = `
        <div class="row-between"><span>現在 → 変更後</span><strong class="nums">${fmtYen(orig)} → ${fmtYen(next)}</strong></div>
        <div class="row-between" style="margin-top:4px;"><span>負債の差額</span><strong class="nums">${diff === 0 ? '¥0（変更なし）' : fmtYen(diff, true)}</strong></div>
        <div class="row-between" style="margin-top:4px;padding-top:4px;border-top:1px solid rgba(0,0,0,0.08);"><span>実質フリー資金への影響</span><strong class="nums">${freeImp === 0 ? '変動なし' : `${fmtYen(freeImp, true)}`}</strong></div>
      `;
    }

    function submitLiab(e, editId) {
      e.preventDefault();
      const name = document.getElementById('m-liab-name').value.trim();
      const balance = Math.max(0, parseYen(document.getElementById('m-liab-amt').value));
      const dueDate = document.getElementById('m-liab-due').value;
      const memo = document.getElementById('m-liab-memo').value.trim();
      if (!name) return;

      if (editId) {
        const l = state.liabilities.find(x => x.id === editId);
        if (l) Object.assign(l, { name, balance, dueDate, memo });
        showToast(`「${name}」を更新しました（${fmtYen(balance)}）`);
      } else {
        state.liabilities.push({ id: uid('liab'), name, balance, dueDate, memo });
        showToast(`負債「${name}」を追加しました`);
      }
      saveState();
      closeModal();
      renderAll();
    }

    function confirmDeleteLiab(id) {
      const l = state.liabilities.find(x => x.id === id);
      if (!l) return;
      openConfirm(`「${l.name}」を削除しますか？`, '削除すると未払残高が確定負債と将来予測から除外されます。', () => {
        state.liabilities = state.liabilities.filter(x => x.id !== id);
        saveState(); renderAll(); showToast('負債を削除しました');
      });
    }

                <label>精算日</label>
                <input type="date" id="m-set-date" class="input" required value="${todayISO()}" />

    function setFullSettle(maxAmt) {
      document.getElementById('m-set-amt').value = fmtNumStr(maxAmt);
      previewSettle(maxAmt);
    }
    function previewSettle(curBal) {
      const amt = Math.max(0, parseYen(document.getElementById('m-set-amt').value));
      const rem = curBal - amt;
      document.getElementById('m-set-prev').innerHTML = `
        <div class="row-between"><span>精算後の未払残高</span><strong class="nums">${rem === 0 ? '¥0（全額精算）' : fmtYen(rem)}</strong></div>
        <div style="font-size:11px;margin-top:4px;">手元キャッシュと負債が同時に相殺されるため、実質フリー資金は変わりません。</div>
      `;
    }
    function submitSettle(e, liabId) {
      e.preventDefault();
      const l = state.liabilities.find(x => x.id === liabId);
      const amount = parseYen(document.getElementById('m-set-amt').value);
      const accountId = document.getElementById('m-set-acc').value;
      const date = document.getElementById('m-set-date').value;
      if (!l || amount <= 0) { showToast('正しい精算金額を入力してください', true); return; }

      const tx = { id: uid('tx'), date, type: 'settlement', amount, accountId, liabilityId: liabId, category: '負債精算', memo: `${l.name} 精算` };
      state.transactions.push(tx);
      applyTxEffect(tx, +1);
      saveState();
      closeModal();
      renderAll();
      showToast(`${l.name} を ${fmtYen(amount)} 精算しました`);
    }

    function submitProv(e, editId) {
      e.preventDefault();
      const name = document.getElementById('m-prov-name').value.trim();
      const balance = Math.max(0, parseYen(document.getElementById('m-prov-bal').value));
      const target = Math.max(0, parseYen(document.getElementById('m-prov-tgt').value));
      const memo = document.getElementById('m-prov-memo').value.trim();
