      } else {
        state.provisions.push({ id: uid('prov'), name, balance, target, memo });
        showToast(`引当枠「${name}」を追加しました`);
      }
      saveState();
      closeModal();
      renderAll();
    }

    function confirmDeleteProv(id) {
      const p = state.provisions.find(x => x.id === id);
      if (!p) return;
      openConfirm(`引当枠「${p.name}」を削除しますか？`, '削除すると確保されていた残高は実質フリー資金へ戻ります。', () => {
        state.provisions = state.provisions.filter(x => x.id !== id);
        saveState(); renderAll(); showToast('引当枠を削除しました');
      });
    }

    /* ---------------------------------------------------------
       MODAL 5: 予定収支の登録・編集
       --------------------------------------------------------- */
    function openSchedModal(defaultKind = 'income', editId = null) {
      const item = editId ? state.scheduled.find(x => x.id === editId) : null;
      const kind = item ? item.kind : (defaultKind || 'income');
      const freq = item ? item.freq : 'monthly';
      const ym0 = curYM();

      if (kind === 'reserve' && state.provisions.length === 0) {
        showToast('先に「引当金」タブで引当枠を作成してください', true); return;
      }

      openModalHTML(`
        <div class="modal-head">
          <h3>${item ? '予定収支を編集' : '予定収支を登録'}</h3>
          <button type="button" class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="submitSched(event,'${editId || ''}')">
          <div class="modal-body">
            <div class="field">
              <label>種別</label>
              <select id="m-sc-kind" class="select" onchange="updateSchedFormUI()">
                <option value="income" ${kind === 'income' ? 'selected' : ''}>予定収入 (+)</option>
                <option value="expense" ${kind === 'expense' ? 'selected' : ''}>予定支出・固定費 (−)</option>
                <option value="reserve" ${kind === 'reserve' ? 'selected' : ''} ${state.provisions.length === 0 ? 'disabled' : ''}>定期引当積立</option>
              </select>
            </div>
            <div class="grid-2">
              <div class="field">
                <label>名称</label>
                <input type="text" id="m-sc-title" class="input" required value="${esc(item ? item.title : '')}" placeholder="例：給与、ボーナス、家賃" />
              </div>
              <div class="field">
                <label>予定金額 (円)</label>
                <div class="input-yen-wrap">
                  <span>¥</span>
                  <input type="text" inputmode="numeric" id="m-sc-amt" class="input" required value="${item ? fmtNumStr(item.amount) : ''}" placeholder="0" oninput="fmtComma(this)" />
                </div>
              </div>
            </div>
            <div class="field">
              <label>発生サイクル</label>
              <div class="seg" style="width:100%;">
                <button type="button" id="m-sc-f-mon" class="seg-btn ${freq === 'monthly' ? 'active' : ''}" style="flex:1;" onclick="setSchedFreq('monthly')">毎月定期</button>
                <button type="button" id="m-sc-f-once" class="seg-btn ${freq === 'once' ? 'active' : ''}" style="flex:1;" onclick="setSchedFreq('once')">単発（ボーナス・旅行等）</button>
              </div>
              <input type="hidden" id="m-sc-freq" value="${freq}" />
            </div>
            <div id="m-sc-mon-box" class="grid-3 ${freq === 'monthly' ? '' : 'hidden'}">
              <div class="field">
                <label>毎月の日</label>
                <input type="number" id="m-sc-day" class="input" min="1" max="31" value="${item ? (item.day || 25) : 25}" />
              </div>
              <div class="field">
                <label>開始月</label>
                <input type="month" id="m-sc-start" class="input" value="${item ? (item.startMonth || ym0) : ym0}" />
              </div>
              <div class="field">
                <label>終了月(任意)</label>
                <input type="month" id="m-sc-end" class="input" value="${item ? (item.endMonth || '') : ''}" />
              </div>
            </div>
            <div id="m-sc-once-box" class="field ${freq === 'once' ? '' : 'hidden'}">
              <label>発生予定日</label>
              <input type="date" id="m-sc-date" class="input" value="${item && item.date ? item.date : clampDate(addMonths(ym0, 1), 15)}" />
            </div>
            <div id="m-sc-acc-wrap" class="field">
              <label>入出金予定の口座</label>
              <select id="m-sc-acc" class="select">
                ${state.accounts.map(a => `<option value="${a.id}" ${item && item.accountId === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}
              </select>
            </div>
            <div id="m-sc-useprov-wrap" class="field hidden">
              <label>引当金から充当する（任意）</label>
              <select id="m-sc-useprov" class="select">
                <option value="">引当金を使わない（通常支出）</option>
                ${state.provisions.map(p => `<option value="${p.id}" ${item && item.useProvisionId === p.id ? 'selected' : ''}>${esc(p.name)} から充当</option>`).join('')}
              </select>
            </div>
            <div id="m-sc-resprov-wrap" class="field hidden">
              <label>積立先の引当枠</label>
              <select id="m-sc-resprov" class="select">
                ${state.provisions.map(p => `<option value="${p.id}" ${item && item.provisionId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>カテゴリ</label>
              <select id="m-sc-cat" class="select"></select>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-soft btn-sm" onclick="closeModal()">キャンセル</button>
            <button type="submit" class="btn btn-primary btn-sm">予定を保存</button>
          </div>
        </form>
      `);
      updateSchedFormUI(item ? item.category : null);
    }

    function setSchedFreq(f) {
      document.getElementById('m-sc-freq').value = f;
      document.getElementById('m-sc-f-mon').className = `seg-btn ${f === 'monthly' ? 'active' : ''}`;
      document.getElementById('m-sc-f-once').className = `seg-btn ${f === 'once' ? 'active' : ''}`;
      document.getElementById('m-sc-mon-box').classList.toggle('hidden', f !== 'monthly');
      document.getElementById('m-sc-once-box').classList.toggle('hidden', f !== 'once');
    }

    function updateSchedFormUI(presetCat = null) {
      const k = document.getElementById('m-sc-kind').value;
      document.getElementById('m-sc-acc-wrap').classList.toggle('hidden', k === 'reserve');
      document.getElementById('m-sc-useprov-wrap').classList.toggle('hidden', k !== 'expense');
      document.getElementById('m-sc-resprov-wrap').classList.toggle('hidden', k !== 'reserve');
      const cats = k === 'income' ? CAT_INC : (k === 'reserve' ? ['引当積立', '特別費'] : CAT_EXP);
      const sel = document.getElementById('m-sc-cat');
      sel.innerHTML = cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      if (presetCat && cats.includes(presetCat)) sel.value = presetCat;
    }

    function submitSched(e, editId) {
      e.preventDefault();
      const kind = document.getElementById('m-sc-kind').value;
      const title = document.getElementById('m-sc-title').value.trim();
      const amount = parseYen(document.getElementById('m-sc-amt').value);
      const freq = document.getElementById('m-sc-freq').value;
      if (!title || amount <= 0) { showToast('名称と1円以上の金額を入力してください', true); return; }

      const payload = {
        kind, title, amount, freq,
        category: document.getElementById('m-sc-cat').value,
        accountId: document.getElementById('m-sc-acc').value,
        useProvisionId: kind === 'expense' ? document.getElementById('m-sc-useprov').value : '',
        provisionId: kind === 'reserve' ? document.getElementById('m-sc-resprov').value : ''
      };
      if (freq === 'once') {
        payload.date = document.getElementById('m-sc-date').value || todayISO();
      } else {
        payload.day = Math.min(31, Math.max(1, Number(document.getElementById('m-sc-day').value) || 25));
        payload.startMonth = document.getElementById('m-sc-start').value || curYM();
        payload.endMonth = document.getElementById('m-sc-end').value || '';
      }

      if (editId) {
        const it = state.scheduled.find(x => x.id === editId);
        if (it) Object.assign(it, payload);
        showToast(`予定「${title}」を更新しました`);
      } else {
        state.scheduled.push({ id: uid('sch'), ...payload, active: true, appliedMonths: [] });
        showToast(`予定「${title}」を登録しました`);
      }
      saveState();
      closeModal();
      renderAll();
    }

    /* ---------------------------------------------------------
       MODAL 6: 口座・データ管理＆1秒データ引き継ぎ
       --------------------------------------------------------- */
    function openDataModal() {
      const t = getTotals();
      openModalHTML(`
        <div class="modal-head">
          <h3>口座・データ管理</h3>
          <button type="button" class="btn-icon" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <!-- 1秒データ引き継ぎ -->
          <div class="info-banner purple" style="display:flex;flex-direction:column;gap:8px;">
            <strong>1秒データ引き継ぎ（コピー＆貼り付け復元）</strong>
            <div style="font-size:11.5px;">更新前に「現在のデータをコピー」して控えておけば、更新後に貼り付けるだけで全データを復元できます。</div>
            <div class="row wrap">
              <button type="button" class="btn btn-purple btn-xs" onclick="copyBackupJSON()">現在のデータをコピー</button>
              <button type="button" class="btn btn-soft btn-xs" onclick="document.getElementById('restore-area').classList.toggle('hidden')">貼り付けて復元する</button>
            </div>
            <div id="restore-area" class="hidden" style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">
              <textarea id="restore-input" class="textarea" rows="3" placeholder="コピーしたJSON文字列をここに貼り付け..."></textarea>
              <div class="row" style="justify-content:flex-end;">
                <button type="button" class="btn btn-primary btn-xs" onclick="restoreFromText()">このデータで復元を実行</button>
              </div>
            </div>
          </div>

          <!-- 口座残高の直接同期・追加・削除 -->
          <div>
            <div class="row-between" style="margin-bottom:8px;">
              <strong style="font-size:13.5px;">手元キャッシュ口座（合計 ${fmtYen(t.cash)}）</strong>
            </div>
            <div class="stack-list">
              ${state.accounts.map(a => `
                <div style="padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:10px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">
                  <strong style="font-size:13.5px;flex:1;min-width:110px;">${esc(a.name)}</strong>
                  <div class="row">
                    <div class="input-yen-wrap" style="width:142px;">
                      <span>¥</span>
                      <input type="text" inputmode="text" class="input" style="padding-top:6px;padding-bottom:6px;font-size:13.5px;text-align:right;" value="${fmtNumStr(a.balance, true)}" oninput="fmtComma(this,true)" onchange="syncAccountBal('${a.id}',this.value)" />
                    </div>
                    ${state.accounts.length > 1 ? `<button type="button" class="btn-icon" onclick="confirmDeleteAcc('${a.id}')" title="口座削除">✕</button>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
            <form onsubmit="addAccount(event)" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
              <input type="text" id="new-acc-name" class="input" style="flex:1;min-width:140px;padding:7px 10px;font-size:13px;" required placeholder="新しい口座名（例：楽天銀行）" />
              <div class="input-yen-wrap" style="width:130px;">
                <span>¥</span>
                <input type="text" inputmode="text" id="new-acc-bal" class="input" style="padding-top:7px;padding-bottom:7px;font-size:13px;" placeholder="0" oninput="fmtComma(this,true)" />
              </div>
              <button type="submit" class="btn btn-primary btn-xs">口座追加</button>
            </form>
          </div>

          <!-- CSV / JSON -->
          <div style="border-top:1px solid var(--border);padding-top:12px;">
            <strong style="font-size:13px;display:block;margin-bottom:8px;">ファイル書き出し・読み込み</strong>
            <div class="grid-3">
              <button type="button" class="btn btn-soft-emerald btn-xs" onclick="exportCSV()">CSV出力 (Excel)</button>
              <button type="button" class="btn btn-soft btn-xs" onclick="exportJSON()">JSON保存</button>
              <label class="btn btn-soft-indigo btn-xs" style="cursor:pointer;">
                JSON読込
                <input type="file" accept=".json" style="display:none;" onchange="importJSON(event)" />
              </label>
            </div>
          </div>

          <!-- リセット -->
          <div style="border-top:1px solid var(--border);padding-top:12px;">
            <strong style="font-size:13px;display:block;margin-bottom:8px;">データのリセット</strong>
            <div class="grid-2">
              <button type="button" class="btn btn-soft-amber btn-xs" onclick="openConfirm('サンプルデータに戻しますか？','現在のデータは初期サンプルへ上書きされます。',()=>{state=createSampleState();saveState();closeModal();renderAll();showToast('サンプルデータに戻しました');})">サンプルデータ初期化</button>
              <button type="button" class="btn btn-soft-red btn-xs" onclick="openConfirm('¥0からリセットしますか？','全履歴・負債・引当・予定がクリアされます。',()=>{state=createEmptyState();saveState();closeModal();renderAll();showToast('¥0から初期化しました');})">¥0リセット</button>
            </div>
          </div>
        </div>
      `, 'modal-lg');
    }

    function syncAccountBal(id, valStr) {
      const a = state.accounts.find(x => x.id === id);
      if (!a) return;
      a.balance = parseYen(valStr, true);
      saveState();
      renderAll();
      openDataModal();
      showToast(`${a.name} の残高を ${fmtYen(a.balance)} に同期しました`);
    }
    function addAccount(e) {
      e.preventDefault();
      const name = document.getElementById('new-acc-name').value.trim();
      const balance = parseYen(document.getElementById('new-acc-bal').value, true);
      if (!name) return;
      state.accounts.push({ id: uid('acc'), name, balance });
      saveState(); renderAll(); openDataModal();
      showToast(`口座「${name}」を追加しました`);
    }
    function confirmDeleteAcc(id) {
      if (state.accounts.length <= 1) return;
      openConfirm('この口座を削除しますか？', '削除するとこの口座残高が手元キャッシュ合計から除外されます。', () => {
        state.accounts = state.accounts.filter(a => a.id !== id);
        saveState(); renderAll(); openDataModal();
        showToast('口座を削除しました');
      });
    }

    function copyBackupJSON() {
      const text = JSON.stringify(state);
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      document.body.removeChild(ta);
      if (ok) {
        showToast('現在のデータをコピーしました！');
      } else {
        const area = document.getElementById('restore-area');
        const inp = document.getElementById('restore-input');
        area.classList.remove('hidden');
        inp.value = text; inp.select();
        showToast('枠内に表示しました。全選択してコピーしてください');
      }
    }

    function restoreFromText() {
      const raw = (document.getElementById('restore-input').value || '').trim();
      if (!raw) { showToast('データを貼り付けてください', true); return; }
      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.accounts)) throw new Error();
        state = normalizeState(parsed);
        ui.selectedTx.clear();
        saveState();
        closeModal();
        renderAll();
        showToast('引き継ぎデータから復元しました！');
      } catch (_) {
        showToast('JSON形式が正しくありません', true);
      }
    }

    function downloadBlob(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportCSV() {
      const head = ['日付', '種別', '金額', 'カテゴリ', 'メモ', '対象'];
      const rows = [...state.transactions].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(tx => [
        tx.date || '', (TX_TYPES[tx.type] || {}).label || tx.type, tx.amount || 0, tx.category || '', tx.memo || '', txTargetLabel(tx)
      ]);
      const csv = '\uFEFF' + [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      downloadBlob(csv, `realcash_lite_${todayISO()}.csv`, 'text/csv;charset=utf-8;');
      showToast('CSVファイルを出力しました');
    }

    function exportJSON() {
      downloadBlob(JSON.stringify(state, null, 2), `realcash_lite_backup_${todayISO()}.json`, 'application/json');
      showToast('JSONバックアップを保存しました');
    }

    function importJSON(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.accounts)) throw new Error();
          state = normalizeState(parsed);
          ui.selectedTx.clear();
          saveState(); closeModal(); renderAll();
          showToast('JSONバックアップから復元しました');
        } catch (_) {
          showToast('JSONの読み込みに失敗しました', true);
        } finally { e.target.value = ''; }
      };
      r.readAsText(f);
    }

    /* ---------------------------------------------------------
       PWA初期化（単一HTMLのままホーム画面アイコン＆全画面起動に対応）
       --------------------------------------------------------- */
    function initPWA() {
      try {
        const iconLink = document.getElementById('pwa-icon');
        const svgHref = iconLink ? iconLink.getAttribute('href') : '';
        const baseScope = location.href.replace(/[^/]*$/, '');

        const applyManifest = (extraIcons = []) => {
          const manifest = {
            name: '実質キャッシュ管理 (RealCash)',
            short_name: 'RealCash',
            description: '手元キャッシュから確定負債・引当金を引いた実質フリー資金と将来予測を管理',
            start_url: location.href,
            scope: baseScope,
            display: 'standalone',
            orientation: 'portrait',
            background_color: '#f8fafc',
            theme_color: '#ffffff',
            icons: [
              ...extraIcons,
              ...(svgHref ? [{ src: svgHref, sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable' }] : [])
            ]
          };
          const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
          const manifestLink = document.getElementById('pwa-manifest');
          if (manifestLink) manifestLink.setAttribute('href', URL.createObjectURL(blob));
        };

        // 即時にSVGアイコンでマニフェストを登録
        applyManifest();

        // Android / iOSのホーム画面アイコン用に高解像度PNGアイコンも動的生成
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        if (ctx && typeof canvas.toBlob === 'function') {
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, 512, 512);
            canvas.toBlob(blob => {
              if (!blob) return;
              const pngUrl = URL.createObjectURL(blob);
              const appleIcon = document.getElementById('pwa-apple-icon');
              if (appleIcon) appleIcon.setAttribute('href', pngUrl);
              applyManifest([{ src: pngUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]);
            }, 'image/png');
          };
          if (svgHref) img.src = svgHref;
        }
      } catch (err) {
        console.warn('PWA初期化スキップ:', err);
      }
    }

    /* ---------------------------------------------------------
       アプリ起動処理
       --------------------------------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      try {
        initPWA();
        loadState();
        ui.expandedMonths.add(curYM());
        renderAll();
      } catch (err) {
        console.error(err);
        showToast('初期化中にエラーが発生しました', true);
      }
    });
  </script>
</body>
</html>
